name: Development CI/CD Pipeline

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-deployment
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Validate (Backend syntax/lint & Frontend build)
  # -------------------------------------------------------------
  validate:
    name: Validate Build & Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate Backend Syntax & Requirements
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        run: |
          cd frontend
          npm ci
          # Use dev env example for test build verification
          cp .env.dev.example .env.dev || cp .env.example .env.dev || true
          npm run build

  # -------------------------------------------------------------
  # Job 2: Deploy to AWS EC2 (dev-mis.winvinaya.com)
  # -------------------------------------------------------------
  deploy-dev:
    name: Deploy to EC2 Development
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Execute Deployment on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            echo "======================================================"
            echo "🚀 Starting Automated Deployment for DEV"
            echo "Server: $(hostname) | Date: $(date)"
            echo "======================================================"

            cd /var/www/wvismis

            # Pull latest changes on dev branch
            git fetch origin dev
            git checkout dev
            git pull origin dev

            # Ensure deployment scripts are executable
            chmod +x deploy/*.sh

            # Execute master dev deployment
            ./deploy/deploy-all.sh dev

            echo "======================================================"
            echo "✅ Dev CI/CD Deployment Completed Successfully!"
            echo "URL: https://dev-mis.winvinaya.com"
            echo "======================================================"
