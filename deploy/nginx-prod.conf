# ==============================================================================
# WinVinaya MIS (WVISMIS) - Production Environment Nginx Configuration
# Target Domain: mis.winvinaya.com, www.mis.winvinaya.com
# Location on EC2: /etc/nginx/sites-available/wvismis-prod.conf
# Enabled via:     sudo ln -sf /etc/nginx/sites-available/wvismis-prod.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Note: Add the following line inside /etc/nginx/nginx.conf inside the http { ... } block:
# limit_req_zone $binary_remote_addr zone=wvismis_api_limit:10m rate=15r/s;

server {
    listen 80;
    server_name mis.winvinaya.com www.mis.winvinaya.com;
    client_max_body_size 50M;

    # Access and Error Logs
    access_log /var/log/nginx/wvismis-prod-access.log;
    error_log  /var/log/nginx/wvismis-prod-error.log warn;

    # Frontend Static Production Build
    root /var/www/wvismis/frontend/dist-prod;
    index index.html;

    # 1. API & WebSocket Reverse Proxy (FastAPI on Port 8002)
    location /api {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for streaming, AI agent reasoning & report generation
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Rate limiting (activate after configuring zone in nginx.conf)
        # limit_req zone=wvismis_api_limit burst=30 nodelay;
        # limit_req_status 429;
    }

    # 2. Interactive API Documentation (Swagger UI)
    location /docs {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. ReDoc Documentation
    location /redoc {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. OpenAPI JSON Schema
    location /openapi.json {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. System Health Check Endpoint
    location /health {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Frontend Single Page Application (SPA) Routing
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static browser assets aggressively
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # 7. Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 8. High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
}
